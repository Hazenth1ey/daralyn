<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dara &amp; Leakhena — A Wedding Retrospective</title>
  <meta name="description" content="An interactive retrospective of our wedding day — with its own soundtrack.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="icon" href="/media/logo-icon.svg" type="image/svg+xml">
  <script>
    // apply the saved theme before first paint to avoid a flash
    try {
      const t = localStorage.getItem('dl-theme');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body data-view="home">
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="atmosphere" aria-hidden="true">
    <div class="grain"></div>
    <div class="vignette"></div>
  </div>

  <button class="site-theme-toggle" id="theme-toggle" aria-label="Toggle day and night" title="day / night">
    <svg class="st-icon st-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.4 5.4l1.7 1.7M16.9 16.9l1.7 1.7M18.6 5.4l-1.7 1.7M7.1 16.9l-1.7 1.7"/>
    </svg>
    <svg class="st-icon st-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
    </svg>
  </button>

  <header class="site-head" id="site-head"></header>

  <main id="view" class="view"></main>

  <div id="player-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
